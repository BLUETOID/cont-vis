<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="emeraldCell" x1="35" y1="14" x2="50" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleCell" x1="35" y1="35" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="2"/>

  <!-- Matrix / Container 2D Grid Cells -->
  <rect x="14" y="14" width="15" height="15" rx="3.5" fill="#18181c" stroke="#52525b" stroke-width="1.6"/>
  <rect x="35" y="14" width="15" height="15" rx="3.5" fill="url(#emeraldCell)" stroke="#34d399" stroke-width="1.6"/>
  <rect x="14" y="35" width="15" height="15" rx="3.5" fill="#27272a" stroke="#71717a" stroke-width="1.6"/>
  <rect x="35" y="35" width="15" height="15" rx="3.5" fill="url(#purpleCell)" stroke="#d8b4fe" stroke-width="1.6"/>

  <!-- Data values in cells -->
  <circle cx="21.5" cy="21.5" r="2.5" fill="#34d399"/>
  <circle cx="42.5" cy="21.5" r="2.5" fill="#ffffff"/>
  <circle cx="21.5" cy="42.5" r="2.5" fill="#ffffff"/>
  <circle cx="42.5" cy="42.5" r="2.5" fill="#ffffff"/>

  <!-- Connecting DP transitions / data-flow paths -->
  <path d="M29 21.5H35" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
  <path d="M21.5 29V35" stroke="#52525b" stroke-width="2" stroke-linecap="round"/>
  <path d="M29 42.5H35" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round"/>
  <path d="M42.5 29V35" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round"/>
</svg>
